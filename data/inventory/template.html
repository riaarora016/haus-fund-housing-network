<style>
/* Tokens follow the Haus Fund design system (haus.fund/design-system): canvas, ink, forest, bronze, steel, semantic. */
:root {
  --canvas-0: #FFFFFF; --canvas-1: #F8F7F3; --canvas-2: #F0EDE6; --canvas-3: #E5E1D9; --border-1: #E5E1D9; --border-2: #CECAC1; --border-3: #A8A49C;
  --ink-1: #0D0D0D; --ink-2: #3A3A3A; --ink-3: #727272; --ink-4: #B0ADA6;
  --forest-1: #0F2419; --forest-2: #1C3B2D; --forest-3: #2A5C46; --forest-4: #3D8C6A; --forest-5: #BDDDD3;
  --bronze-3: #B8924A; --bronze-5: #F2E8D5; --steel-4: #4A90C4; --steel-5: #C8DFEF;
  --positive: #1B7A48; --positive-bg: #D8F0E5; --warning: #C47A1A; --warning-bg: #FDF0D5; --negative: #B83232; --negative-bg: #F5D5D5; --info: #1A4E8A; --info-bg: #D5E5F8;
  --accent: var(--forest-2); --accent-ink: var(--forest-3); --accent-soft: var(--forest-5); --on-accent: #F8F7F3;
  --glass: rgba(255,255,255,.74); --glass-2: rgba(255,255,255,.9); --glass-border: rgba(13,13,13,.09); --glass-dark: rgba(15,36,25,.78); --on-glass-dark: #F2EFE8;
  --shadow-sm: 0 1px 4px rgba(13,13,13,.06), 0 1px 2px rgba(13,13,13,.04); --shadow-md: 0 4px 12px rgba(13,13,13,.08), 0 1px 3px rgba(13,13,13,.04); --shadow-lg: 0 8px 24px rgba(13,13,13,.10), 0 2px 6px rgba(13,13,13,.04); --shadow-xl: 0 16px 48px rgba(13,13,13,.12), 0 4px 12px rgba(13,13,13,.05);
  --tile-filter: none; --map-ground: #0F2419;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif; --font-heading: "Barlow", system-ui, sans-serif; --font-body: "DM Sans", system-ui, sans-serif; --font-mono: "DM Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1); --fast: 100ms; --base: 160ms; --spring: 280ms;
  --panel-w: clamp(360px, 38vw, 470px); --gap: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas-0: #17211C; --canvas-1: #0F1713; --canvas-2: #1E2A24; --canvas-3: #27352E; --border-1: #27352E; --border-2: #3A4A41; --border-3: #55665C;
  --ink-1: #F2EFE8; --ink-2: #D8D4CB; --ink-3: #9AA39C; --ink-4: #66706A;
  --accent: #4FA37E; --accent-ink: #9FD6BE; --accent-soft: #1E3A2E; --on-accent: #0F2419;
  --positive: #4CC48A; --positive-bg: #17352A; --warning: #E0A24A; --warning-bg: #3A2C15; --negative: #E36A6A; --negative-bg: #3D1E1E; --info: #6FA8E0; --info-bg: #17293D;
  --glass: rgba(20,28,24,.74); --glass-2: rgba(20,28,24,.92); --glass-border: rgba(242,239,232,.10); --glass-dark: rgba(10,18,14,.8);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.4); --shadow-md: 0 4px 12px rgba(0,0,0,.45); --shadow-lg: 0 8px 24px rgba(0,0,0,.5); --shadow-xl: 0 16px 48px rgba(0,0,0,.55);
  --tile-filter: brightness(.86) contrast(1.04); } }
:root[data-theme="dark"] {
  --canvas-0: #17211C; --canvas-1: #0F1713; --canvas-2: #1E2A24; --canvas-3: #27352E; --border-1: #27352E; --border-2: #3A4A41; --border-3: #55665C;
  --ink-1: #F2EFE8; --ink-2: #D8D4CB; --ink-3: #9AA39C; --ink-4: #66706A;
  --accent: #4FA37E; --accent-ink: #9FD6BE; --accent-soft: #1E3A2E; --on-accent: #0F2419;
  --positive: #4CC48A; --positive-bg: #17352A; --warning: #E0A24A; --warning-bg: #3A2C15; --negative: #E36A6A; --negative-bg: #3D1E1E; --info: #6FA8E0; --info-bg: #17293D;
  --glass: rgba(20,28,24,.74); --glass-2: rgba(20,28,24,.92); --glass-border: rgba(242,239,232,.10); --glass-dark: rgba(10,18,14,.8);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.4); --shadow-md: 0 4px 12px rgba(0,0,0,.45); --shadow-lg: 0 8px 24px rgba(0,0,0,.5); --shadow-xl: 0 16px 48px rgba(0,0,0,.55);
  --tile-filter: brightness(.86) contrast(1.04); }

* { box-sizing: border-box; } html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--canvas-1); color: var(--ink-1); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-heading); font-weight: 700; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; } button { cursor: pointer; }
a { color: var(--accent-ink); }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.unk { color: var(--ink-3); } code { font-family: var(--font-mono); font-size: 12px; }
.glass { background: var(--glass); backdrop-filter: blur(20px) saturate(1.25); -webkit-backdrop-filter: blur(20px) saturate(1.25); border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-2); background: var(--canvas-0); border-radius: 6px; padding: 7px 12px; text-decoration: none; color: var(--ink-1); font-size: 13px; font-weight: 500; transition: border-color var(--fast), background var(--fast); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; } .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); } .btn.on { border-color: var(--accent); color: var(--accent-ink); } .btn:hover { border-color: var(--accent); }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border-2); color: var(--ink-3); white-space: nowrap; }
.tag.deal { border-color: var(--bronze-3); color: var(--bronze-3); } .tag.haus { border-color: var(--accent); color: var(--accent-ink); } .tag.ok { color: var(--positive); border-color: var(--positive); } .tag.warn { color: var(--warning); border-color: var(--warning); }
.st { font-size: 10.5px; padding: 2px 7px; border-radius: 4px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.st.muted { background: var(--canvas-2); color: var(--ink-3); } .st.info { background: var(--info-bg); color: var(--info); } .st.warn { background: var(--warning-bg); color: var(--warning); } .st.good { background: var(--positive-bg); color: var(--positive); } .st.bad { background: var(--negative-bg); color: var(--negative); }
.fx { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border-2); color: var(--ink-2); white-space: nowrap; } .fx.ok { color: var(--positive); border-color: var(--positive); } .fx.bad { color: var(--on-accent); background: var(--negative); border-color: var(--negative); font-weight: 600; } .fx.warn { color: var(--warning); border-color: var(--warning); }
.fr { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-1); color: var(--ink-3); white-space: nowrap; } .fr.fresh { color: var(--positive); border-color: var(--positive); } .fr.aging { color: var(--warning); border-color: var(--warning); } .fr.stale { color: var(--negative); border-color: var(--negative); } .fr.haus { color: var(--accent-ink); border-color: var(--accent); } .fr.attn { color: var(--warning); }
.mini { font-size: 12px; border: 1px solid var(--border-2); background: var(--canvas-0); border-radius: 999px; padding: 3px 10px; color: var(--ink-1); transition: border-color var(--fast); } .mini:hover { border-color: var(--accent); } .mini.ghost { background: transparent; color: var(--ink-3); }

/* shell */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
header.top { display: flex; align-items: center; gap: 10px 18px; padding: 0 var(--gap); min-height: 52px; background: var(--canvas-0); border-bottom: 1px solid var(--border-1); flex-wrap: wrap; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; color: inherit; }
.brand svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.brand .wm { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.brand .wm b { font-weight: 800; color: var(--accent-ink); } .brand .sub { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.hbtn { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 500; color: var(--ink-3); transition: all var(--fast); white-space: nowrap; }
.hbtn:hover { color: var(--ink-1); background: var(--canvas-2); } .hbtn[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
.hgroup { display: flex; gap: 2px; border: 1px solid var(--border-1); border-radius: 8px; padding: 2px; background: var(--canvas-1); }
.hright { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0; } .iconbtn svg { width: 17px; height: 17px; }

.stage { position: relative; flex: 1; min-height: 0; background: var(--map-ground); overflow: hidden; }
.mapwrap { position: absolute; inset: 0; overflow: hidden; }
#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; } #map.panning { cursor: grabbing; }
.tiles image { filter: var(--tile-filter); }
.nomap { position: absolute; inset: 0; display: grid; place-items: center; color: var(--on-glass-dark); font-family: var(--font-display); font-size: 22px; text-transform: uppercase; letter-spacing: .05em; }

/* left panel */
.panel { position: absolute; left: var(--gap); top: var(--gap); bottom: var(--gap); width: var(--panel-w); display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; z-index: 20; }
.ptop { flex: none; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--glass-border); }
.prompt { display: flex; align-items: center; gap: 8px; background: var(--canvas-0); border: 1px solid var(--border-2); border-radius: 10px; padding: 6px 6px 6px 12px; box-shadow: var(--shadow-sm); transition: border-color var(--fast); }
.prompt:focus-within { border-color: var(--accent); } .prompt svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.prompt input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; } .prompt input::placeholder { color: var(--ink-4); }
.prompt button { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 7px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
#reading { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--ink-3); } #reading:empty { display: none; } .rd-l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
#chips { display: flex; flex-wrap: wrap; gap: 5px; position: relative; } .fchip-wrap { position: relative; }
.fchip { border: 1px solid var(--border-2); background: var(--canvas-0); border-radius: 999px; padding: 4px 8px 4px 11px; font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 3px; align-items: center; transition: all var(--fast); } .fchip .car { width: 12px; height: 12px; opacity: .6; }
.fchip:hover { border-color: var(--accent); } .fchip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 260px; max-width: 320px; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 9px; background: var(--glass-2); }
.pop label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-3); } .pop label.row { flex-direction: row; align-items: center; gap: 8px; color: var(--ink-1); }
.pop input:not([type=checkbox]):not([type=radio]), .pop select { border: 1px solid var(--border-2); background: var(--canvas-0); border-radius: 6px; padding: 6px 8px; color: var(--ink-1); }
.pop .stack { display: flex; flex-direction: column; gap: 5px; max-height: 240px; overflow: auto; } .pop-hint { font-size: 11.5px; color: var(--ink-3); } .pop-actions { display: flex; justify-content: flex-end; }
.seg { display: flex; border: 1px solid var(--border-2); border-radius: 7px; overflow: hidden; } .seg button { flex: 1; border: 0; background: var(--canvas-0); padding: 7px; color: var(--ink-3); } .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
#metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; } #metrics:empty { display: none; }
.metric { text-align: center; padding: 4px 2px; border-radius: 6px; background: var(--canvas-0); border: 1px solid var(--border-1); } .metric .n { display: block; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.05; font-variant-numeric: tabular-nums; } .metric .l { display: block; font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-top: 2px; }
.lhead { display: none; align-items: center; justify-content: space-between; padding: 7px 14px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--glass-border); } body.has-results .lhead { display: flex; }
.lhead select { border: 1px solid var(--border-2); background: var(--canvas-0); border-radius: 6px; padding: 3px 6px; font-size: 12px; color: var(--ink-1); }
#list { flex: 1 1 auto; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }

/* intro */
.intro { padding: 22px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
.intro-eyebrow, .intro-l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.intro-l { color: var(--ink-3); margin-top: 8px; }
.intro-h { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: .95; letter-spacing: .01em; }
.intro-p { margin: 0; color: var(--ink-3); font-size: 13.5px; max-width: 42ch; }
.hpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hbtn-card { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--border-1); background: var(--canvas-0); border-radius: 10px; padding: 9px 11px; transition: border-color var(--fast), transform var(--fast); }
.hbtn-card:hover { border-color: var(--accent); transform: translateY(-1px); } .hbtn-card b { display: block; font-family: var(--font-heading); font-weight: 700; font-size: 14px; } .hbtn-card small { color: var(--ink-3); font-size: 11.5px; }
.hdiamond { width: 11px; height: 11px; background: var(--accent); border-radius: 2px; transform: rotate(45deg); display: inline-block; flex: none; }
.sug { display: flex; flex-wrap: wrap; gap: 6px; }

/* cards */
.card { padding: 11px 14px; border-bottom: 1px solid var(--glass-border); cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: background var(--fast); }
.card:hover, .card.hov { background: color-mix(in srgb, var(--canvas-0) 55%, transparent); } .card.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); } .card.dead { opacity: .55; }
.c-top { display: flex; align-items: flex-start; gap: 8px; } .c-name { font-family: var(--font-heading); font-weight: 700; font-size: 14.5px; flex: 1; } .c-sub { font-size: 12px; color: var(--ink-3); }
.star { border: 0; background: transparent; padding: 0 2px; line-height: 1; color: var(--ink-4); } .star svg { width: 16px; height: 16px; fill: none; } .star.on { color: var(--bronze-3); } .star.on svg { fill: currentColor; } .star:hover { color: var(--bronze-3); }
.c-price { display: flex; align-items: baseline; gap: 8px; } .c-price .p { font-family: var(--font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; } .c-price .p small { font-size: 11px; color: var(--ink-3); } .c-price .p.estimate { color: var(--ink-2); } .c-price .p.unknown { font-family: var(--font-body); font-size: 12.5px; color: var(--ink-3); }
.ptag { font-size: 11px; color: var(--ink-3); } .ptag.fresh { color: var(--positive); } .ptag.aging { color: var(--warning); } .ptag.stale { color: var(--negative); }
.fit { margin-left: auto; font-size: 11px; color: var(--ink-3); cursor: help; } .fit b { font-family: var(--font-mono); font-size: 13.5px; color: var(--ink-1); } .fit.big { font-size: 12px; } .fit.big b { font-size: 17px; }
.c-facts { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12.5px; align-items: center; } .c-cfg { font-size: 12px; color: var(--ink-3); } .c-meta { display: flex; flex-wrap: wrap; gap: 4px; }
.empty { padding: 24px 18px; color: var(--ink-3); } .empty h3 { font-size: 16px; color: var(--ink-1); margin-bottom: 8px; } .empty ul { margin: 6px 0 12px; padding-left: 18px; }

/* panel collapse tab (like an editor sidebar) */
.panel { transition: transform var(--spring) var(--ease), opacity var(--spring); }
.panel-tab { position: absolute; top: 50%; left: calc(var(--panel-w) + var(--gap) + 6px); transform: translateY(-50%); width: 18px; height: 72px; border-radius: 0 9px 9px 0; border: 1px solid rgba(255,255,255,.12); border-left: 0; background: var(--glass-dark); color: var(--on-glass-dark); display: flex; align-items: center; justify-content: center; padding: 0; z-index: 21; transition: left var(--spring) var(--ease), background var(--fast); backdrop-filter: blur(10px); }
.panel-tab:hover { background: var(--forest-2); } .panel-tab svg { width: 14px; height: 14px; transition: transform var(--spring); }
body.panel-collapsed .panel { transform: translateX(calc(-100% - var(--gap) - 12px)); opacity: 0; pointer-events: none; }
body.panel-collapsed .panel-tab { left: 0; } body.panel-collapsed .panel-tab svg { transform: rotate(180deg); }
body.panel-collapsed .map-top, body.panel-collapsed #legend { --panel-w: 0px; }
/* map controls */
.map-top { position: absolute; top: var(--gap); left: calc(var(--panel-w) + var(--gap) * 2); right: 64px; display: flex; align-items: center; gap: 8px; z-index: 15; pointer-events: none; } .map-top > * { pointer-events: auto; }
.mctl.tr { position: absolute; right: var(--gap); top: var(--gap); display: flex; flex-direction: column; gap: 6px; z-index: 15; }
.mbtn { border: 1px solid rgba(255,255,255,.12); background: var(--glass-dark); color: var(--on-glass-dark); border-radius: 8px; min-width: 36px; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background var(--fast); }
.mbtn:hover { background: var(--forest-2); } .mbtn[aria-pressed="true"] { background: var(--forest-5); color: var(--forest-1); } .mbtn:disabled { opacity: .45; cursor: default; } .mbtn svg { width: 16px; height: 16px; }
.mgroup { display: flex; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; background: var(--glass-dark); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); } .mgroup .mbtn { border: 0; border-radius: 0; background: transparent; backdrop-filter: none; } .mgroup .mbtn + .mbtn { border-left: 1px solid rgba(255,255,255,.12); } .mgroup .mbtn[aria-pressed="true"] { background: var(--forest-5); color: var(--forest-1); }
#search-area { margin-left: auto; margin-right: auto; opacity: 0; pointer-events: none; transform: translateY(-8px); transition: all var(--base) var(--ease); border-radius: 999px; background: var(--canvas-0); color: var(--ink-1); border-color: var(--border-2); box-shadow: var(--shadow-md); } #search-area.show { opacity: 1; pointer-events: auto; transform: none; }
#legend { position: absolute; left: calc(var(--panel-w) + var(--gap) * 2); bottom: 28px; background: var(--glass-dark); color: var(--on-glass-dark); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; font-size: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 15; }
#legend-toggle { border: 0; background: transparent; color: inherit; padding: 7px 11px; font-size: 12px; font-weight: 500; width: 100%; text-align: left; } #legend .lg-body { display: none; padding: 0 11px 9px; flex-direction: column; gap: 4px; } #legend.open .lg-body { display: flex; }
#legend label { display: flex; align-items: center; gap: 7px; } .lg-sw { width: 10px; height: 10px; display: inline-block; border-radius: 50%; } .lg-sw.haus { background: var(--forest-4); border-radius: 2px; transform: rotate(45deg); } .lg-sw.anchor { background: #fff; border: 2px solid var(--forest-4); border-radius: 2px; transform: rotate(45deg); } .lg-sw.cand { background: #fff; border-radius: 6px; width: 16px; } .lg-sw.signed { background: var(--positive); border-radius: 6px; width: 16px; }
.attrib { position: absolute; right: 6px; bottom: 6px; font-size: 10px; color: #D8D4CB; background: var(--glass-dark); padding: 2px 7px; border-radius: 6px; z-index: 15; }

/* streets and names, Google satellite palette: Roboto, white type with a soft dark halo, yellow arterials */
